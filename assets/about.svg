    <text x="40" y="281" class="body-text">My goal is to help people and push the world further ahead than it was yesterday.</text>
    <text x="40" y="301" class="body-text">I want to be part of the generation that makes technology genuinely work for humans –</text>
    <text x="40" y="321" class="body-text">not the other way around. Humanity first, technology second.</text>
