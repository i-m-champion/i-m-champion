    <text x="40" y="75" class="body-text">Hey, I'm Ayush – an engineer passionate about building tools that simplify people's lives.</text>
    <text x="40" y="95" class="body-text">I work at the intersection of AI, autonomous agents, and backend systems, and I write about</text>
    <text x="40" y="115" class="body-text">what I build and learn along the way.</text>
