<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <!-- Dark Cyber Gradient Background -->
    <linearGradient id="drone-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050805" />
      <stop offset="50%" stop-color="#08120a" />
      <stop offset="100%" stop-color="#050805" />
    </linearGradient>

    <!-- Scan Beam Gradient -->
    <linearGradient id="scan-beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#00ff66" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0.0" />
    </linearGradient>

    <!-- Jet Flame Gradient -->
    <linearGradient id="jet-flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="drone-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#00ff66" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#10b981" flood-opacity="0.55" />
    </filter>

    <filter id="scanner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00ff66" flood-opacity="0.7" />
    </filter>

    <style>
      @keyframes drone-bob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      @keyframes scan-sweep {
        0%, 100% { transform: rotate(-26deg); }
        50% { transform: rotate(26deg); }
      }

      @keyframes thruster-pulse {
        0%, 100% { opacity: 0.8; transform: scaleY(1); }
        50% { opacity: 1; transform: scaleY(1.35); }
      }

      @keyframes eye-pulse {
        0%, 100% { r: 5px; opacity: 0.9; }
        50% { r: 7.5px; opacity: 1; }
      }

      @keyframes reticle-pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.04); }
      }

      .drone-group {
        animation: drone-bob 3.8s ease-in-out infinite;
        transform-origin: 425.0px 85px;
      }

      .scanner-beam {
        animation: scan-sweep 4.6s ease-in-out infinite;
        transform-origin: 425.0px 97px;
      }

      .flame-left {
        animation: thruster-pulse 0.25s ease-in-out infinite alternate;
        transform-origin: 373.0px 92px;
      }

      .flame-right {
        animation: thruster-pulse 0.28s ease-in-out infinite alternate;
        transform-origin: 477.0px 92px;
      }

      .pulse-eye {
        animation: eye-pulse 2s ease-in-out infinite;
      }

      .reticle {
        animation: reticle-pulse 3s ease-in-out infinite;
        transform-origin: 425.0px 85px;
      }

      .hud-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #86efac;
        letter-spacing: 0.8px;
      }

      .hud-dim {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        fill: #4b6352;
      }
    </style>
  </defs>

  <!-- Base Container -->
  <rect width="850" height="200" rx="12" fill="url(#drone-bg)" stroke="#16381e" stroke-width="1.4" />

  <!-- Cyber Matrix Scanlines -->
  <line x1="0" y1="28" x2="850" y2="28" stroke="#16381e" stroke-width="1" />
  <line x1="0" y1="172" x2="850" y2="172" stroke="#16381e" stroke-width="1" />

  <!-- Top Header HUD -->
  <circle cx="24" cy="15" r="4" fill="#ff5f56" />
  <circle cx="38" cy="15" r="4" fill="#ffbd2e" />
  <circle cx="52" cy="15" r="4" fill="#27c93f" />
  <text x="72" y="19" class="hud-text" font-weight="700">SENTINEL-01 // AUTONOMOUS RECON DRONE</text>
  <text x="826" y="19" text-anchor="end" class="hud-text"><tspan fill="#00ff66">● LIVE TELEMETRY</tspan></text>

  <!-- Perspective Ground Telemetry Grid -->
  <g opacity="0.4">
    <!-- Longitudinal perspective lines converging toward center -->
    <line x1="100" y1="172" x2="245.0" y2="130" stroke="#164320" stroke-width="1" />
    <line x1="220" y1="172" x2="325.0" y2="130" stroke="#164320" stroke-width="1" />
    <line x1="340" y1="172" x2="390.0" y2="130" stroke="#164320" stroke-width="1" />
    <line x1="425.0" y1="172" x2="425.0" y2="130" stroke="#00ff66" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="510" y1="172" x2="460.0" y2="130" stroke="#164320" stroke-width="1" />
    <line x1="630" y1="172" x2="525.0" y2="130" stroke="#164320" stroke-width="1" />
    <line x1="750" y1="172" x2="605.0" y2="130" stroke="#164320" stroke-width="1" />

    <!-- Latitudinal grid steps -->
    <line x1="180" y1="136" x2="670" y2="136" stroke="#14351a" stroke-width="1" />
    <line x1="140" y1="148" x2="710" y2="148" stroke="#164320" stroke-width="1" />
    <line x1="90" y1="162" x2="760" y2="162" stroke="#1d592a" stroke-width="1" />
  </g>

  <!-- Sweeping Holographic Radar Cone (Oscillates & Scans) -->
  <g class="scanner-beam" filter="url(#scanner-glow)">
    <path d="M 425.0,97 L 340.0,170 L 510.0,170 Z" fill="url(#scan-beam-grad)" />
    <!-- Scanning Arc Line at bottom of cone -->
    <path d="M 340.0,170 Q 425.0,176 510.0,170" stroke="#00ff66" stroke-width="2" fill="none" opacity="0.75" />
  </g>

  <!-- DRONE BODY (Animates Bobbing Up and Down) -->
  <g class="drone-group">
    <!-- Thruster Plasma Flames -->
    <g class="flame-left">
      <polygon points="368.0,91 378.0,91 373.0,109" fill="url(#jet-flame)" />
    </g>
    <g class="flame-right">
      <polygon points="472.0,91 482.0,91 477.0,109" fill="url(#jet-flame)" />
    </g>

    <!-- Structural Carbon-Fiber Wings / Struts -->
    <g filter="url(#drone-glow)">
      <path d="M 365.0,83 L 401.0,80 L 401.0,91 L 365.0,88 Z" fill="#112415" stroke="#00ff66" stroke-width="1.4" />
      <path d="M 485.0,83 L 449.0,80 L 449.0,91 L 485.0,88 Z" fill="#112415" stroke="#00ff66" stroke-width="1.4" />

      <!-- Left Dual Thruster Pod -->
      <rect x="359.0" y="77" width="26" height="14" rx="4" fill="#0d1d11" stroke="#00ff66" stroke-width="1.8" />
      <line x1="359.0" y1="84" x2="385.0" y2="84" stroke="#39ff14" stroke-width="1" />
      <circle cx="372.0" cy="84" r="2.5" fill="#00ff66" />

      <!-- Right Dual Thruster Pod -->
      <rect x="465.0" y="77" width="26" height="14" rx="4" fill="#0d1d11" stroke="#00ff66" stroke-width="1.8" />
      <line x1="465.0" y1="84" x2="491.0" y2="84" stroke="#39ff14" stroke-width="1" />
      <circle cx="478.0" cy="84" r="2.5" fill="#00ff66" />

      <!-- Main Chassis Hull (Hexagonal / Armored Shape) -->
      <polygon points="397.0,67 453.0,67 459.0,87 443.0,103 407.0,103 391.0,87" 
               fill="#0c190e" 
               stroke="#00ff66" 
               stroke-width="2" />

      <!-- Inner Armor Plate -->
      <polygon points="405.0,73 445.0,73 449.0,86 437.0,97 413.0,97 401.0,86" 
               fill="#142b18" 
               stroke="#22c55e" 
               stroke-width="1" />

      <!-- Central Pulsing Mechanical Eye / Lens -->
      <circle cx="425.0" cy="85" r="10" fill="#050805" stroke="#00ff66" stroke-width="2" />
      <circle cx="425.0" cy="85" r="6" fill="#ffffff" class="pulse-eye" />
    </g>

    <!-- Targeting HUD Crosshair Reticle -->
    <g class="reticle" stroke="#00ff66" stroke-width="1" fill="none">
      <line x1="381.0" y1="85" x2="387.0" y2="85" />
      <line x1="463.0" y1="85" x2="469.0" y2="85" />
      <line x1="425.0" y1="59" x2="425.0" y2="65" />
      <line x1="425.0" y1="105" x2="425.0" y2="111" />
      <!-- Target Corner Brackets -->
      <path d="M 387.0,67 L 381.0,67 L 381.0,73" />
      <path d="M 463.0,67 L 469.0,67 L 469.0,73" />
      <path d="M 387.0,103 L 381.0,103 L 381.0,97" />
      <path d="M 463.0,103 L 469.0,103 L 469.0,97" />
    </g>
  </g>

  <!-- Bottom Telemetry HUD Bar -->
  <text x="24" y="190" class="hud-text">SYS_FOV: <tspan fill="#00ff66">104°</tspan> // RADAR: <tspan fill="#00ff66">SWEEPING</tspan></text>
  <text x="425.0" y="190" text-anchor="middle" class="hud-dim">COORDINATES: [28.6139° N, 77.2090° E] // SECTOR: 0x7F</text>
  <text x="826" y="190" text-anchor="end" class="hud-text">TELEMETRY_LINK: <tspan fill="#00ff66">ACTIVE</tspan></text>
</svg>