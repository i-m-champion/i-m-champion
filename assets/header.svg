<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <!-- Background Hacker Obsidian / Terminal Gradient -->
    <linearGradient id="hacker-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050805" />
      <stop offset="40%" stop-color="#0a120b" />
      <stop offset="80%" stop-color="#0d1a0e" />
      <stop offset="100%" stop-color="#060c07" />
    </linearGradient>

    <!-- Matrix Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00ff66" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Matrix Green Wave 1 -->
    <linearGradient id="m-wave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d2818" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#047857" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.5" />
    </linearGradient>

    <!-- Matrix Green Wave 2 -->
    <linearGradient id="m-wave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ayush Signature Neon Hacker Green Gradient -->
    <linearGradient id="ayush-hacker-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="25%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#39ff14" />
    </linearGradient>

    <!-- Cyber Border Gradient -->
    <linearGradient id="cyber-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00ff66" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <!-- Intense Hacker Green Glow Filter -->
    <filter id="hacker-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00ff66" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#10b981" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00ff41" flood-opacity="0.45" />
    </filter>

    <style>
      @keyframes pulse-hacker {
        0%, 100% {
          filter: drop-shadow(0 0 4px #00ff66) drop-shadow(0 0 10px rgba(0, 255, 102, 0.7));
          transform: translateY(0px);
        }
        50% {
          filter: drop-shadow(0 0 8px #39ff14) drop-shadow(0 0 18px rgba(57, 255, 20, 0.95));
          transform: translateY(-1.5px);
        }
      }

      @keyframes wave-hand {
        0%, 100% { transform: rotate(0deg); }
        20%, 60% { transform: rotate(14deg); }
        40%, 80% { transform: rotate(-8deg); }
      }

      .prefix-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 32px;
        font-weight: 600;
        fill: #c0caf5;
        letter-spacing: -0.5px;
      }

      .ayush-group {
        animation: pulse-hacker 2.8s ease-in-out infinite;
        transform-origin: center;
      }

      .hand-wave {
        display: inline-block;
        transform-origin: 606px 88px;
        animation: wave-hand 2.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Terminal Container -->
  <rect width="850" height="160" rx="14" fill="url(#hacker-bg)" />
  <rect width="850" height="160" rx="14" fill="url(#scanlines)" />
  <rect width="850" height="160" rx="14" fill="none" stroke="url(#cyber-border)" stroke-width="1.5" />

  <!-- Clean Window Header Bar (No title text) -->
  <path d="M 0,14 C 0,6 6,0 14,0 L 836,0 C 844,0 850,6 850,14 L 850,28 L 0,28 Z" fill="#0c160e" />
  <line x1="0" y1="28" x2="850" y2="28" stroke="#16381e" stroke-width="1" />

  <!-- Clean Window Controls (Red / Yellow / Green dots) -->
  <circle cx="20" cy="14" r="5" fill="#ff5f56" />
  <circle cx="36" cy="14" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="14" r="5" fill="#27c93f" />

  <!-- Fluid Bottom Matrix Waves -->
  <path d="M 0,138 C 180,122 340,150 520,134 C 680,122 780,146 850,142 L 850,160 L 0,160 Z" fill="url(#m-wave-1)" />
  <path d="M 0,150 C 160,136 320,155 490,144 C 660,132 760,152 850,150 L 850,160 L 0,160 Z" fill="url(#m-wave-2)" />

  <!-- Greeting Prefix: Hi there, I'm (Cleanly Spaced) -->
  <text x="220" y="100" class="prefix-text">Hi there, I'm</text>

  <!-- Ayush in Google Font Caveat with Matrix Neon Glow -->
  <g class="ayush-group" filter="url(#hacker-glow)">
    <g transform="translate(445, 100)">
