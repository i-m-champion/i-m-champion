<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c09" />
      <stop offset="50%" stop-color="#0d140e" />
      <stop offset="100%" stop-color="#080c09" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="matrix-scanlines" width="60" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#00ff66" stroke-opacity="0.03" stroke-width="1" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="radar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00ff66" flood-opacity="0.8" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 600;
        fill: #f0f6fc;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #9ca3af;
      }
      .repo-link {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #58a6ff;
        cursor: pointer;
      }
      .axis-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #8b949e;
      }
      .axis-pct {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #e6edf3;
      }
      @keyframes pulse-poly {
        0%, 100% {
          fill-opacity: 0.35;
          stroke-opacity: 0.9;
        }
        50% {
          fill-opacity: 0.55;
          stroke-opacity: 1;
        }
      }
      .radar-poly {
        animation: pulse-poly 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="220" rx="12" fill="url(#card-bg)" stroke="#1b3d24" stroke-width="1.4" />
  <rect width="850" height="220" rx="12" fill="url(#matrix-scanlines)" />

  <!-- LEFT COLUMN: Activity Overview & Repositories -->
  <text x="36" y="36" class="title-text">Activity overview</text>

  <!-- Book / Repo Icon -->
  <g transform="translate(36, 52)">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="#8b949e">
      <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 0 0 1.5h2.5a2.25 2.25 0 0 0 2.25-2.25V.75A2.25 2.25 0 0 0 13.25 0H4.5A4 4 0 0 0 .5 4v10.5A1.5 1.5 0 0 0 2 16h10.25a.75.75 0 0 0 0-1.5H2A.5.5 0 0 1 1.5 14V4c0-.828.672-1.5 1.5-1.5z"/>
    </svg>
    <text x="24" y="13" class="sub-text">Contributed to</text>
  </g>

  <!-- Repository list -->
  <g transform="translate(60, 88)">
    <a href="https://github.com/i-m-champion/Bug-lens"><text x="0" y="0" class="repo-link">i-m-champion/Bug-lens</text></a>
    <text x="165" y="0" class="sub-text">,</text>

    <a href="https://github.com/i-m-champion/linkedIn-connector-bot"><text x="0" y="24" class="repo-link">i-m-champion/linkedIn-connector-bot</text></a>
    <text x="265" y="24" class="sub-text">,</text>

    <a href="https://github.com/i-m-champion/Repo-Surgeon"><text x="0" y="48" class="repo-link">i-m-champion/Repo-Surgeon</text></a>
    <text x="205" y="48" class="sub-text">,</text>

    <a href="https://github.com/i-m-champion/Web-dev-"><text x="0" y="72" class="repo-link">i-m-champion/Web-dev-</text></a>
    <text x="165" y="72" class="sub-text">and firstcontributions</text>
  </g>

  <!-- Center Divider Line -->
  <line x1="420" y1="20" x2="420" y2="200" stroke="#1b3d24" stroke-width="1.2" />

  <!-- RIGHT COLUMN: Radar Chart -->
  <!-- Crosshair Axes (Green Neon) -->
  <line x1="508" y1="110" x2="762" y2="110" stroke="#22c55e" stroke-width="2.2" />
  <line x1="635" y1="33" x2="635" y2="187" stroke="#22c55e" stroke-width="2.2" />

  <!-- Top Axis Label: Code review -->
  <text x="635" y="25" text-anchor="middle" class="axis-label">Code review</text>

  <!-- Left Axis Label: 94% Commits -->
  <g transform="translate(498, 110)">
    <text x="0" y="-4" text-anchor="end" class="axis-pct">94%</text>
    <text x="0" y="12" text-anchor="end" class="axis-label">Commits</text>
  </g>

  <!-- Right Axis Label: 2% Issues -->
  <g transform="translate(772, 110)">
    <text x="0" y="-4" text-anchor="start" class="axis-pct">2%</text>
    <text x="0" y="12" text-anchor="start" class="axis-label">Issues</text>
  </g>

  <!-- Bottom Axis Label: 4% Pull requests -->
  <g transform="translate(635, 199)">
    <text x="0" y="0" text-anchor="middle" class="axis-pct">4%</text>
    <text x="0" y="16" text-anchor="middle" class="axis-label">Pull requests</text>
  </g>

  <!-- Radar Polygon Surface (Neon Green Filled) -->
  <g filter="url(#radar-glow)">
    <polygon points="527,110 635,109 639,110 635,115" 
             fill="#00ff66" 
             stroke="#39ff14" 
             stroke-width="2" 
             class="radar-poly" />

    <!-- Data Marker Dots -->
    <!-- Commits (Left) -->
    <circle cx="527" cy="110" r="4" fill="#ffffff" stroke="#00ff66" stroke-width="2" />
    <!-- PRs (Bottom) -->
    <circle cx="635" cy="115" r="3.5" fill="#ffffff" stroke="#00ff66" stroke-width="1.5" />
    <!-- Center / Issues -->
    <circle cx="639" cy="110" r="3.5" fill="#ffffff" stroke="#00ff66" stroke-width="1.5" />
    <circle cx="635" cy="109" r="3.5" fill="#ffffff" stroke="#00ff66" stroke-width="1.5" />
  </g>
</svg>